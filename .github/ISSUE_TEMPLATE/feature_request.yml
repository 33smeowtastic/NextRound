name: Feature request / 功能建议
description: Explain a user problem and the smallest useful improvement / 说明用户问题与最小有用改进
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Focus on the user problem, not private interview materials. Do not upload résumés, interview transcripts, contact details, full backups or recordings.
        请描述用户问题，不要上传真实简历、面试原文、联系方式、完整备份或录音。
        This project is local-first. Requests do not imply that accounts, cloud services or built-in AI will be added.
        本项目以本地优先为边界，提交建议不代表将新增账号、云服务或内置 AI。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: My request contains no personal records or secrets / 建议中不含个人记录或凭证
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem / 用户问题
      description: Who has this problem, in which task, and what is difficult today? / 谁在什么任务中遇到问题，目前具体困难是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement / 建议改进
      description: Describe the smallest change that would help / 描述最小可用改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround and alternatives / 现有办法与替代方案
  - type: textarea
    id: success
    attributes:
      label: How would this help? / 如何判断有帮助？
      description: An observable result is enough; do not invent usage or business metrics / 可描述可观察结果，不必编造使用或业务数据
  - type: input
    id: environment
    attributes:
      label: Relevant environment or version / 相关环境或版本
