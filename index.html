    <section id="startup-loading" aria-label="下一场加载">
      <svg
        class="startup-mark"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <rect width="24" height="24" rx="5.25" fill="#12110f" />
        <g stroke="#fff" stroke-linecap="round">
          <path d="M15.5 18.694A8 8 0 1 0 8.5 18.694" stroke-width=".94" />
          <path
            d="M14.35 16.333A5.375 5.375 0 1 0 9.65 16.333"
            stroke-width=".94"
          />
        </g>
        <path
          d="M9.875 19.125h4.25"
          stroke="#bff55c"
          stroke-width=".94"
          stroke-linecap="round"
        />
      </svg>
      <p class="startup-title">下一场 · NextRound</p>
      <div class="startup-progress-wrap">
        <div
          class="startup-progress"
          role="progressbar"
          aria-label="首屏准备进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span data-startup-fill></span>
        </div>
        <div class="startup-meta">
          <p
            class="startup-message"
            data-startup-message
            role="status"
            aria-live="polite"
          >
            正在打开下一场
          </p>
          <span class="startup-percent" data-startup-percent aria-hidden="true"
            >0%</span
          >
        </div>
      </div>
      <p class="startup-note" data-startup-note>准备 · 训练 · 记录 · 复盘</p>
      <p class="startup-detail" data-startup-detail hidden></p>
      <div class="startup-actions">
        <button type="button" data-startup-retry hidden>重新打开</button
        ><button type="button" data-startup-continue hidden>先进入</button>
      </div>
      <noscript
        ><p class="startup-note">
          请启用 JavaScript 后重新打开，本地档案保留在此浏览器中。<br><a href="./about/">也可先阅读产品介绍与使用说明（无需 JavaScript）</a>
        </p></noscript
      >
    </section>
